plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    defaultConfig {
        applicationId "dev.workers.navahue.examia.twa"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0.5"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("STORE_PASSWORD") ?: "examia123"
            keyAlias System.getenv("KEY_ALIAS") ?: "examia"
            keyPassword System.getenv("KEY_PASSWORD") ?: "examia123"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}